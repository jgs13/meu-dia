name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, manifest.webmanifest, icon-192.png, icon-512.png, .github/workflows/build-apk.yml]
permissions:
  contents: write
concurrency: apk
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Chave de assinatura
        run: |
          mkdir -p ~/.android
          if [ ! -f meu-dia.keystore ]; then
            keytool -genkeypair -keystore meu-dia.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Meu Dia"
            git config user.name github-actions
            git config user.email actions@github.com
            git add meu-dia.keystore
            git commit -m "Chave do app"
            git push
          fi
          cp meu-dia.keystore ~/.android/debug.keystore
      - name: Montar o app
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/share@6 @capacitor/filesystem@6
          npx cap init "Meu Dia" com.jardel.meudia --web-dir www
          npx cap add android
          npx cap sync android
          R=android/app/src/main
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.WAKE_LOCK"/></manifest>#' $R/AndroidManifest.xml
          rm -rf $R/res/mipmap-anydpi-v26
          C=$(command -v magick || echo convert)
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            for n in ic_launcher ic_launcher_round; do
              $C icon-512.png -resize ${p#*:}x${p#*:} $R/res/mipmap-${p%%:*}/$n.png
            done
          done
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Compilar
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Meu Dia (versão ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
