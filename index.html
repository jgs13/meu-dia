:root[data-theme="teal"]{--bg:#0e2225;--ink:#e3f2ef;--mut:#9ab9b5;--pri:#168b83;--hd:#123b3d;--ok:#42a879;--bad:#ff7770;--line:#285052;--card:#173437}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,Roboto,sans-serif;padding-bottom:40px}
header{background:var(--hd);color:#fff;padding:calc(env(safe-area-inset-top) + 20px) 20px 22px}

#tabs{display:flex;gap:10px;overflow-x:auto;padding:16px 16px 8px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 18px;font:600 16px system-ui}

#main{padding:8px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}

.verse{font-size:21px;font-weight:600;margin:6px 0}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:13px 18px;font:600 16px system-ui;margin:4px 6px 4px 0}
.btn.s{background:var(--line);color:var(--ink);padding:9px 14px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.grow{flex:1;min-width:0}.grow small{display:block;color:var(--mut)}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--mut);background:none;color:transparent;font-size:18px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.x{border:0;background:none;color:var(--mut);font-size:20px;padding:6px}
.late b{color:var(--bad)}.paid b{text-decoration:line-through;color:var(--mut)}
.tm{font-size:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:20px;padding:8px 12px;font:15px system-ui}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sw{width:52px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)}.sw.on:after{left:25px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#172c48;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
.prog{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}.prog span{display:block;height:100%;background:var(--ok)}
.bars{height:130px;display:flex;align-items:flex-end;gap:8px;padding-top:12px;margin-bottom:28px}.bars div{flex:1;background:#8da9c5;border-radius:7px 7px 0 0;min-height:4px;position:relative}.bars span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut)}
.pill{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--line);color:var(--mut);white-space:nowrap}.pill.good{background:#e6f5ed;color:var(--ok)}.pill.bad{background:#ffebe8;color:var(--bad)}.pill.warn{background:#fff4df;color:#b7791f}
.timer{font-size:48px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;padding:10px 0}
.btn:disabled{opacity:.45}.sum{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.sum:first-of-type{border-top:0}
</style></head><body>
